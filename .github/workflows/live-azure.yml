name: Live Azure validation

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read # ghr verifies the Zig release archive's GitHub attestation.
  id-token: write # azure/login authenticates to Azure with GitHub OIDC.

concurrency:
  group: sshca-live-azure
  cancel-in-progress: false

jobs:
  keyvault-and-sshd:
    runs-on: ubuntu-24.04
    environment: live-azure
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: AzureCloud
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev pkg-config
      - name: Run live Key Vault and SSH login validation
        env:
          SSHCA_TEST_VAULT_URL: ${{ vars.SSHCA_TEST_VAULT_URL }}
          SSHCA_TEST_KEY_NAME: ${{ vars.SSHCA_TEST_KEY_NAME }}
          SSHCA_TEST_KEY_VERSION: ${{ vars.SSHCA_TEST_KEY_VERSION }}
          SSHCA_TEST_CLOUD: public
          SSHCA_AZURE_CREDENTIAL: azure-cli
        run: zig build live-azure-test -Dlive-azure=true --summary all
