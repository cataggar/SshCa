name: Zig build and test

on:
  push:
    branches: [main, zig16]
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: read # ghr verifies the Zig release archive's GitHub attestation.

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Check formatting
        run: zig fmt --check build.zig src tests
      - name: Run core tests
        run: zig build test --summary all
      - name: Build CLI
        run: zig build --summary all

  openssh-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpam0g-dev libssl-dev pkg-config zlib1g-dev
      - name: Run pinned OpenSSH and sshd tests
        run: zig build integration-test -Dwith-sshd=true --summary all
