name: Zig build and test

on:
  push:
    branches: [main, zig16]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check build.zig src tests
      - name: Run core tests
        run: zig build test --summary all
      - name: Build CLI
        run: zig build --summary all

  openssh-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpam0g-dev libssl-dev pkg-config zlib1g-dev
      - name: Run pinned OpenSSH and sshd tests
        run: zig build integration-test -Dwith-sshd=true --summary all
